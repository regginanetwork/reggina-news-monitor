name: Reggina News Monitor

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

# Una sola esecuzione alla volta: evita che due controlli sovrapposti vedano lo stesso articolo
# come nuovo (doppio messaggio su Telegram e doppio avvio del post WhatsApp).
concurrency:
  group: reggina-news-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RN_DISPATCH_TOKEN: ${{ secrets.RN_DISPATCH_TOKEN }}
        run: python monitor.py

      - name: Salva articoli visti
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_articles.json
          git diff --staged --quiet || git commit -m "Update seen articles [skip ci]"
          git push
